nas:
  routine_update_path: \\192.168.0.151\hefang总部\14-数据中台\达播数据同步\例行
  urgent_update_path: \\192.168.0.151\hefang总部\14-数据中台\达播数据同步\紧急
  processed_path: \\192.168.0.151\hefang总部\14-数据中台\达播数据同步\已处理
  quarantine_path: \\192.168.0.151\hefang总部\14-数据中台\达播数据同步\隔离

mysql:
  host_env: MYSQL_HOST
  port_env: MYSQL_PORT
  user_env: MYSQL_USER
  password_env: MYSQL_PASSWORD
  database_env: MYSQL_DB
  charset_env: MYSQL_CHARSET
  charset: utf8mb4
  host_default: 127.0.0.1
  port_default: 3306

oracle:
  host_env: ORACLE_HOST
  port_env: ORACLE_PORT
  service_env: ORACLE_SERVICE
  user_env: ORACLE_USER
  password_env: ORACLE_PASSWORD
  dsn_env: ORACLE_DSN

etl:
  order_status_allowlist:
    - 已完成
    - 已发货
  sku_match_threshold: 0.95
  delete_days: 60
  retry_count: 3
  retry_delay_seconds: 5

logging:
  level: INFO
  log_dir: logs

# 企业微信告警机器人 webhook，若不配置则不发送告警
notifications:
  # 可直接设置 webhook URL（字符串），
  # 或留空并通过环境变量 `WECHAT_WEBHOOK` 提供（优先级：环境变量 > 配置文件）。
  # 示例（请替换为真实 webhook）：
  # wechat_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxx-xxxx-xxxx"
  # 默认为空字符串；注意：要实际发送告警，既要将 `notifications.enabled` 设为 true，
  # 也要通过环境变量 `WECHAT_WEBHOOK` 或在此字段填入有效的 webhook URL。
  wechat_webhook: ""
  # 是否启用告警发送（若为 false 则不会发送）
  enabled: true
  # 单次告警发送超时时间（秒）
  timeout: 10
  # 摘要中保留的 top N SKU 数量
  top_n: 5
  # 告警消息最大长度，超出将被截断
  max_len: 1500
